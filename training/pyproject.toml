[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lae-training"
version = "0.4.0"
description = "Offline dataset, optimization, evaluation, and artifact tools for LAE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lae-train = "lae_training.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
