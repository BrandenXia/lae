[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lae-runtime"
version = "0.12.0"
description = "Python bindings for the LAE typographic emphasis runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/BrandenXia/lae"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lae = ["py.typed"]
